<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Argus">
  <title>Argus</title>
  <!--
    Argus Panoptes, le geant aux cent yeux : l'oeil est la marque.
    Contrainte de conception dominante : rester lisible a 16 px dans un onglet.
    D'ou le fond plein (l'icone garde son contraste sur un onglet clair comme
    sombre) et un oeil volontairement large — teste au pixel, une pupille plus
    grosse reduit le blanc a des croissants et la forme cesse de se lire.
  -->
  <rect width="32" height="32" rx="7" fill="#4c8dff"/>
  <path d="M2.5 16 Q16 3.5 29.5 16 Q16 28.5 2.5 16 Z" fill="#fff"/>
  <circle cx="16" cy="16" r="5.4" fill="#4c8dff"/>
</svg>
