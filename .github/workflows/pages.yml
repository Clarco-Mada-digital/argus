name: Site GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      # Le jeton d'un workflow ne peut pas creer un site Pages : l'API exige
      # une permission d'administration que GITHUB_TOKEN ne peut pas recevoir.
      # L'activation est donc une etape manuelle, a faire une seule fois. On la
      # detecte ici pour afficher une consigne claire plutot qu'une erreur d'API.
      - name: Verifier que Pages est active
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")

          if [ "$code" = "404" ]; then
            echo "::error title=GitHub Pages n'est pas active::Activez-la une seule fois : Settings -> Pages -> Source : GitHub Actions, puis relancez ce workflow."
            {
              echo "## GitHub Pages doit etre active"
              echo
              echo "Cette etape ne peut pas etre automatisee : creer un site Pages demande une"
              echo "permission d'administration que le jeton d'un workflow ne peut pas obtenir."
              echo
              echo "**A faire une seule fois :**"
              echo
              echo "1. Ouvrir **Settings -> Pages** du depot"
              echo "2. Sous **Build and deployment**, choisir **Source : GitHub Actions**"
              echo "3. Relancer ce workflow (**Re-run all jobs**)"
              echo
              echo "Le site sera ensuite publie a chaque \`push\` sur \`main\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "Pages est active (HTTP $code) : publication en cours."

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Le site embarque le coeur d'Argus : la page d'analyse importe
      # directement src/ via une carte d'imports, sans etape de construction.
      - name: Assembler le site
        run: |
          # -L suit le lien symbolique site/src : le coeur d'Argus est copie
          # a l'interieur du site, a l'emplacement exact que les imports
          # attendent deja en local.
          mkdir -p _site
          cp -rL site/. _site/

          # Rapport de demonstration, regenere a chaque publication : ce que le
          # visiteur voit correspond toujours a la version en ligne.
          node bin/argus.js scan tests/fixtures/demo-site \
            --no-history --html _site/demo.html --silent || true

          # Liste de precache du service worker, generee depuis le site
          # assemble : le site est installable et fonctionne hors ligne, ce
          # qui compte ici parce que l'analyse tourne entierement dans
          # l'onglet. Une liste ecrite a la main aurait pourri au premier
          # module ajoute, et un precache incomplet ne casse que le mode hors
          # ligne — c'est-a-dire ce que personne ne teste avant de livrer.
          node scripts/site-precache.js _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploiement
        uses: actions/deploy-pages@v4
