name: Site GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Le site embarque le coeur d'Argus : la page d'analyse importe
      # directement src/ via une carte d'imports, sans etape de construction.
      - name: Assembler le site
        run: |
          mkdir -p _site
          cp -r site/* _site/
          mkdir -p _site/src && cp -r src/* _site/src/

          # Rapport de demonstration, regenere a chaque publication : ce que le
          # visiteur voit correspond toujours a la version en ligne.
          node bin/argus.js scan tests/fixtures/demo-site \
            --no-history --html _site/demo.html --silent || true

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploiement
        uses: actions/deploy-pages@v4
