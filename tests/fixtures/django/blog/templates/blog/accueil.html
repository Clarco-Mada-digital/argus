<!doctype html>
<html>
<head>
  <title>Blog</title>
</head>
<body>
  <h1>Derniers articles</h1>
  <img src="{% static 'blog/banniere.png' %}">
  <ul>

    <li><a href="{% url 'detail-article' article.pk %}">{{ article.titre }}</a></li>

  {% endfor %}
  </ul>
  <a href="/articles/">Tous les articles</a>
  <a href="{% url 'liste-artciles' %}">Faute de frappe</a>

  <div onclick="ouvrir()">Cliquez</div>
  <form method="post">
    <input type="text" name="email" placeholder="Email">
    <button></button>
  </form>
</body>
</html>
